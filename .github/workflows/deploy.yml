name: 📢 Publish Modpack to Modrinth

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release (e.g., v3.0.0)"
        required: true
        type: string

jobs:
  build-and-publish:
    name: 🚀 Build and Publish Modpack
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write access required to create tags and GitHub releases

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # Fetch complete repository history for accurate versioning/changelogs
          persist-credentials: false # Avoid storing sensitive GITHUB_TOKEN credentials locally
          allow-unsafe-pr-checkout: true # Retained for compatibility across shared checkout templates

      - name: 🐹 Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27"
          cache-dependency-path: src/tools/go.sum

      - name: 📦 Install Packwiz
        run: |
          go install github.com/packwiz/packwiz@latest

      - name: ⚡ Verify and Export Modpack via lifemc-cli
        run: |
          cd src/tools
          go run . export

      - name: 📤 Publish to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: "src/*/*.mrpack"
          version: "${{ inputs.version }}"
          version-type: "release"
